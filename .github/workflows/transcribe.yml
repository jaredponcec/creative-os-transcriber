name: transcribe-ads

on:
  schedule:
    - cron: "0 7 * * *"   # nightly, 1:00 AM Boise time
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Transcribe new ads
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT: act_1505073096814143
          MAX_PER_RUN: "25"
        run: python transcribe.py

      - name: Commit transcripts
        run: |
          git config user.name "creative-os-bot"
          git config user.email "creative-os-bot@users.noreply.github.com"
          git add transcripts
          git diff --cached --quiet || git commit -m "transcripts: nightly run"
          git push
